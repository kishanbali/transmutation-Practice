name: Activate PWA
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PWA hooks without changing app logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          manifest='<link rel="manifest" href="./manifest.json">'
          registration="""<script>\nif ('serviceWorker' in navigator) {\n  window.addEventListener('load', () => {\n    navigator.serviceWorker.register('./service-worker.js');\n  });\n}\n</script>"""
          if 'href="./manifest.json"' not in s and "href='./manifest.json'" not in s:
              s=s.replace('</head>', '    '+manifest+'\n</head>', 1)
          if 'serviceWorker.register' not in s:
              s=s.replace('</body>', '    '+registration+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit PWA activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Activate PWA service worker"
          git push
