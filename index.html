<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmutation Engine - Prototype</title>
    <style>
        :root { --bg: #0a0c10; --card: #12161f; --accent: #38bdf8; --green: #22c55e; --text: #f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); border: 1px solid #1e293b; padding: 2.5rem; border-radius: 20px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        h1 { font-size: 1.6rem; color: var(--accent); margin: 0 0 0.5rem 0; letter-spacing: -0.5px; }
        p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.8rem; line-height: 1.4; }
        .timer { font-size: 2.8rem; font-family: monospace; font-weight: bold; color: var(--green); margin: 0.8rem 0; text-shadow: 0 0 20px rgba(34, 197, 94, 0.2); }
        .badge { display: inline-block; padding: 0.4rem 1rem; border-radius: 9999px; background: #1e293b; color: var(--accent); font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; border: 1px solid #334155; }
        button { background: var(--green); color: #000; border: none; padding: 1rem 2rem; font-size: 1.1rem; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); opacity: 0.95; }
        button.active { background: #ef4444; color: #fff; }
        .controls { margin-top: 1.5rem; display: grid; gap: 0.6rem; }
        .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #64748b; }
        .metric span:last-child { color: var(--text); font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Transmutation Engine</h1>
        <p>112-Day Neuro-Coherency Audio System<br><small>Generative Web Audio API Prototype</small></p>
        <div class="badge" id="phaseBadge">Phase 1: Grounding & Stillness</div>
        <div class="timer" id="timer">00:00</div>
        <button id="toggleBtn" onclick="toggleEngine()">Start Audio Session</button>
        <div class="controls">
            <div class="metric"><span>Frequency Bed:</span><span id="freqMeter">60 Hz</span></div>
            <div class="metric"><span>Intensity Level:</span><span id="intensityMeter">10%</span></div>
            <div class="metric"><span>Spatial Field:</span><span id="spatialMeter">Center</span></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isRunning = false;
        let startTime = 0;
        let timerLoop = null;
        let droneOsc = null, masterGain = null, mainFilter = null, panner = null;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);

            panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

            mainFilter = audioCtx.createBiquadFilter();
            mainFilter.type = 'lowpass';
            mainFilter.frequency.setValueAtTime(300, audioCtx.currentTime);

            droneOsc = audioCtx.createOscillator();
            droneOsc.type = 'sine';
            droneOsc.frequency.setValueAtTime(60, audioCtx.currentTime);

            droneOsc.connect(mainFilter);
            if (panner) {
                mainFilter.connect(panner);
                panner.connect(masterGain);
            } else {
                mainFilter.connect(masterGain);
            }
            masterGain.connect(audioCtx.destination);

            droneOsc.start();
        }

        function triggerChime(freq, volume) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(volume * 0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.8);

            osc.connect(gain);
            gain.connect(masterGain);

            osc.start();
            osc.stop(audioCtx.currentTime + 4.0);
        }

        function toggleEngine() {
            const btn = document.getElementById('toggleBtn');
            if (!isRunning) {
                if (!audioCtx) initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                isRunning = true;
                startTime = Date.now();
                btn.innerText = "Stop Session";
                btn.classList.add('active');
                timerLoop = setInterval(updateEngine, 1000);
            } else {
                isRunning = false;
                audioCtx.suspend();
                clearInterval(timerLoop);
                btn.innerText = "Resume Session";
                btn.classList.remove('active');
            }
        }

        function updateEngine() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000) % 720;
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timer').innerText = ${mins}:${secs};

            // 3D Panning Automation (Page 4)
            const pan = Math.sin(elapsed / 6);
            if (panner) panner.pan.setValueAtTime(pan * 0.75, audioCtx.currentTime);
            document.getElementById('spatialMeter').innerText = pan < -0.2 ? 'Left Orbit' : pan > 0.2 ? 'Right Orbit' : 'Centered';

            const badge = document.getElementById('phaseBadge');
            const freqMeter = document.getElementById('freqMeter');
            const intensityMeter = document.getElementById('intensityMeter');

            if (elapsed < 180) { // Phase 1: 0-3m
                badge.innerText = "Phase 1: Grounding & Stillness";
                freqMeter.innerText = "60 Hz Baseline";
                intensityMeter.innerText = "10%";
                mainFilter.frequency.setTargetAtTime(300, audioCtx.currentTime, 1);
            } else if (elapsed < 360) { // Phase 2: 3-6m
                badge.innerText = "Phase 2: Dusk Observation";
                freqMeter.innerText = "Sub-Pulse Sweeps";
                intensityMeter.innerText = "30%";
                mainFilter.frequency.setTargetAtTime(500 + Math.sin(elapsed) * 150, audioCtx.currentTime, 1);
            } else if (elapsed < 540) { // Phase 3: 6-9m
                badge.innerText = "Phase 3: Synaptic Expansion";
                const intensity = Math.floor(10 + ((elapsed - 360) / 180) * 90);
                freqMeter.innerText = "Chimes 1–11 Active";
                intensityMeter.innerText = ${intensity}%;
                mainFilter.frequency.setTargetAtTime(1200, audioCtx.currentTime, 1);

                if (elapsed % 12 === 0) {
                    const chimeFreq = 432 + ((elapsed % 11) * 28);
                    triggerChime(chimeFreq, intensity / 100);
                }
            } else { // Phase 4: 9-12m
                badge.innerText = "Phase 4: Spatial Convergence";
                freqMeter.innerText = "Dual Low-End + 3D Field";
                intensityMeter.innerText = "100% -> Settling";
                mainFilter.frequency.setTargetAtTime(400, audioCtx.currentTime, 2);
            }
        }
    </script>
</body>
</html>
