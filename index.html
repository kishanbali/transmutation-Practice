<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmutation Battery Engine</title>
    <style>
        :root { --bg: #0a0c10; --card: #12161f; --accent: #38bdf8; --green: #22c55e; --text: #f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; box-sizing: border-box; }
        .card { background: var(--card); border: 1px solid #1e293b; padding: 2rem; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        h1 { font-size: 1.4rem; color: var(--accent); margin: 0 0 0.3rem 0; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #94a3b8; font-size: 0.8rem; margin-bottom: 1.5rem; }

        /* Battery Visual Casing */
        .battery-container { display: flex; align-items: center; justify-content: center; margin: 1.2rem 0; }
        .battery-body { width: 100%; height: 60px; border: 3px solid #334155; border-radius: 12px; padding: 4px; position: relative; background: #000; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); display: flex; align-items: center; }
        .battery-tip { width: 10px; height: 26px; background: #334155; border-radius: 0 4px 4px 0; margin-left: 3px; }
        
        /* Battery Progress Fill */
        .battery-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #16a34a, var(--green)); border-radius: 6px; transition: width 0.3s ease; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .charging .battery-fill { animation: pulseCharge 1.5s infinite alternate; }

        /* 4 Milestone Charging Blocks Overlaid */
        .battery-blocks { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; box-sizing: border-box; }
        .block { border-right: 2px dashed rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 4px; font-size: 0.65rem; font-weight: bold; color: #475569; transition: all 0.3s ease; }
        .block:last-child { border-right: none; }
        .block.active { color: #000; text-shadow: 0 0 5px rgba(255,255,255,0.8); }
        .block.charged { color: var(--green); font-weight: 900; }

        /* Digital Meter Displays */
        .charge-percent { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: var(--green); margin-top: 0.5rem; letter-spacing: 1px; }
        .timer { font-size: 2.5rem; font-family: monospace; font-weight: bold; color: var(--text); margin: 0.2rem 0; }
        .badge { display: inline-block; padding: 0.4rem 1rem; border-radius: 9999px; background: #1e293b; color: var(--accent); font-size: 0.78rem; font-weight: 600; margin-bottom: 0.5rem; border: 1px solid #334155; }

        button { background: var(--green); color: #000; border: none; padding: 1.1rem 2rem; font-size: 1.1rem; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 1rem; -webkit-tap-highlight-color: transparent; }
        button.active { background: #ef4444; color: #fff; }

        .metrics { margin-top: 1.2rem; display: grid; gap: 0.5rem; text-align: left; background: #000; padding: 0.8rem 1rem; border-radius: 10px; border: 1px solid #1e293b; }
        .metric { display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b; }
        .metric span:last-child { color: var(--text); font-weight: 600; }

        @keyframes pulseCharge {
            0% { opacity: 0.85; }
            100% { opacity: 1; filter: drop-shadow(0 0 8px var(--green)); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Transmutation Unit</h1>
        <p>112-Day Neuro-Coherency Charging System</p>

        <div class="badge" id="phaseBadge">System Discharged</div>

        <!-- Battery Charging Component -->
        <div class="battery-container" id="batteryCasing">
            <div class="battery-body">
                <div class="battery-fill" id="batteryFill"></div>
                <div class="battery-blocks">
                    <div class="block" id="blk1"><span>1M</span></div>
                    <div class="block" id="blk2"><span>3M</span></div>
                    <div class="block" id="blk3"><span>6M</span></div>
                    <div class="block" id="blk4"><span>9M</span></div>
                </div>
            </div>
            <div class="battery-tip"></div>
        </div>

        <div class="charge-percent" id="chargeMeter">0.0% CHARGED</div>
        <div class="timer" id="timer">00:00</div>

        <button id="toggleBtn">Initiate Charge Session</button>

        <div class="metrics">
            <div class="metric"><span>Frequency Bed:</span><span id="freqMeter">60 Hz Bed + Harmonics</span></div>
            <div class="metric"><span>Output Intensity:</span><span id="intensityMeter">10%</span></div>
            <div class="metric"><span>Spatial Vector:</span><span id="spatialMeter">Centered</span></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isRunning = false;
        let startTime = 0;
        let timerLoop = null;

        let droneOsc = null, harmonicOsc = null, masterGain = null, filterNode = null, pannerNode = null;

        const btn = document.getElementById('toggleBtn');

        async function toggleEngine() {
            if (!isRunning) {
                try {
                    if (!audioCtx) {
                        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                        audioCtx = new AudioCtxClass();
                    }

                    if (audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }

                    masterGain = audioCtx.createGain();
                    masterGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

                    filterNode = audioCtx.createBiquadFilter();
                    filterNode.type = 'lowpass';
                    filterNode.frequency.setValueAtTime(600, audioCtx.currentTime);

                    pannerNode = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

                    droneOsc = audioCtx.createOscillator();
                    droneOsc.type = 'sine';
                    droneOsc.frequency.setValueAtTime(60, audioCtx.currentTime);

                    harmonicOsc = audioCtx.createOscillator();
                    harmonicOsc.type = 'triangle';
                    harmonicOsc.frequency.setValueAtTime(220, audioCtx.currentTime);

                    const harmonicGain = audioCtx.createGain();
                    harmonicGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

                    droneOsc.connect(filterNode);
                    harmonicOsc.connect(harmonicGain);
                    harmonicGain.connect(filterNode);

                    if (pannerNode) {
                        filterNode.connect(pannerNode);
                        pannerNode.connect(masterGain);
                    } else {
                        filterNode.connect(masterGain);
                    }

                    masterGain.connect(audioCtx.destination);

                    droneOsc.start();
                    harmonicOsc.start();

                    isRunning = true;
                    startTime = Date.now();
                    btn.innerText = "Abort Charging Session";
                    btn.classList.add('active');
                    document.getElementById('batteryCasing').classList.add('charging');

                    if (timerLoop) clearInterval(timerLoop);
                    timerLoop = setInterval(updateEngine, 1000);
                    updateEngine();

                } catch (e) {
                    alert('Audio initialization error: ' + e.message);
                }
            } else {
                isRunning = false;
                if (droneOsc) { droneOsc.stop(); droneOsc.disconnect(); }
                if (harmonicOsc) { harmonicOsc.stop(); harmonicOsc.disconnect(); }
                if (audioCtx) await audioCtx.suspend();

                clearInterval(timerLoop);
                btn.innerText = "Resume Charging Session";
                btn.classList.remove('active');
                document.getElementById('batteryCasing').classList.remove('charging');
            }
        }

        function triggerChime(freq, volume) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(volume * 0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.5);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start();
                osc.stop(audioCtx.currentTime + 3.6);
            } catch (e) {}
        }

        function updateEngine() {
            if (!isRunning) return;

            // 12-Minute Cycle (720s total = 100% Charge)
            const elapsed = Math.floor((Date.now() - startTime) / 1000) % 720;
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timer').innerText = ${mins}:${secs};

            // Calculate Percentage
            const pct = ((elapsed / 720) * 100).toFixed(1);
            document.getElementById('batteryFill').style.width = ${pct}%;
            document.getElementById('chargeMeter').innerText = ${pct}% CHARGED;

            // Milestone Blocks Glow Logic
            const b1 = document.getElementById('blk1');
            const b2 = document.getElementById('blk2');
            const b3 = document.getElementById('blk3');
            const b4 = document.getElementById('blk4');

            if (elapsed >= 60) b1.className = "block charged"; else if (elapsed > 0) b1.className = "block active";
            if (elapsed >= 180) b2.className = "block charged"; else if (elapsed >= 60) b2.className = "block active";
            if (elapsed >= 360) b3.className = "block charged"; else if (elapsed >= 180) b3.className = "block active";
            if (elapsed >= 540) b4.className = "block charged"; else if (elapsed >= 360) b4.className = "block active";

            // Spatial Orbit Panning
            const pan = Math.sin(elapsed / 5);
            if (pannerNode && pannerNode.pan) {
                pannerNode.pan.setValueAtTime(pan * 0.75, audioCtx.currentTime);
            }
            document.getElementById('spatialMeter').innerText = pan < -0.2 ? 'Left Orbit' : pan > 0.2 ? 'Right Orbit' : 'Centered';

            const badge = document.getElementById('phaseBadge');
            const freqMeter = document.getElementById('freqMeter');
            const intensityMeter = document.getElementById('intensityMeter');

            // Phase Switching & Frequency Adjustments
            if (elapsed < 180) { // Phase 1 (0 - 3 Mins)
                badge.innerText = "Phase 1: Grounding Charge (0-3m)";
                freqMeter.innerText = "60 Hz Bed + 220 Hz Harmonic";
                intensityMeter.innerText = "10%";
                if (filterNode) filterNode.frequency.setTargetAtTime(600, audioCtx.currentTime, 1);

            } else if (elapsed < 360) { // Phase 2 (3 - 6 Mins)
                badge.innerText = "Phase 2: Dusk Resonance (3-6m)";
                freqMeter.innerText = "Sub-Pulse Lowpass Sweeps";
                intensityMeter.innerText = "30%";
                if (filterNode) filterNode.frequency.setTargetAtTime(500 + Math.sin(elapsed) * 200, audioCtx.currentTime, 1);

            } else if (elapsed < 540) { // Phase 3 (6 - 9 Mins)
                badge.innerText = "Phase 3: Synaptic Surge (6-9m)";
                const intensity = Math.floor(10 + ((elapsed - 360) / 180) * 90);
                freqMeter.innerText = "11 Synaptic Chimes Active";
                intensityMeter.innerText = ${intensity}%;
                if (filterNode) filterNode.frequency.setTargetAtTime(1200, audioCtx.currentTime, 1);

                if (elapsed % 12 === 0) {
                    const chimeFreq = 432 + ((elapsed % 11) * 28);
                    triggerChime(chimeFreq, intensity / 100);
                }

            } else { // Phase 4 (9 - 12 Mins)
                badge.innerText = "Phase 4: Full Capacity (9-12m)";
                freqMeter.innerText = "Dual Low-End + 3D Field";
                intensityMeter.innerText = "100% -> Settled";
                if (filterNode) filterNode.frequency.setTargetAtTime(500, audioCtx.currentTime, 2);
            }
        }

        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            toggleEngine();
        });
    </script>
</body>
</html>
